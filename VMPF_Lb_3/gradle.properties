# Параметри JVM для процесу збирання Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Використовувати бібліотеки AndroidX
android.useAndroidX=true

# Стиль коду Kotlin (офіційний)
kotlin.code.style=official

# Невіртуальні R-класи (тільки ресурси цього модуля) — швидша збірка
android.nonTransitiveRClass=true
